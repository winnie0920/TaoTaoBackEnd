services:
  mysql:
    image: mysql:8.0
    container_name: taotao-mysql
    restart: unless-stopped          # 容器掛掉會自動重啟，但手動 docker stop 不會被拉回來
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}   # 這些變數從同層的 .env 檔讀入，不要寫死在這裡
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Taipei                  # 避免時間戳寫入時跟系統時區對不上
    ports:
      # 只綁 loopback (127.0.0.1)，代表只有「這台主機本機」能連進 3306，
      # 外部網路完全連不到，只有同機器上的 management 容器（走內部網路）能存取。
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 這裡的 .sql 只在資料目錄「全新是空的」時才會執行一次
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    networks:
      - taotao-net
    healthcheck:
      # 一定要帶帳密，否則認證失敗仍可能回傳成功，healthy 會是假的
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1",
             "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s     # 每 10 秒檢查一次
      timeout: 5s       # 單次檢查超過 5 秒視為失敗
      retries: 5        # 連續失敗 5 次才會被標記成 unhealthy
      # 涵蓋首次匯入 SQL 的時間，這段失敗不計入 retries，
      # 避免第一次啟動因為匯入資料較久而被誤判成不健康
      start_period: 60s

  redis:
    image: redis:7
    container_name: taotao-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}   # 強制要求密碼，避免匿名連線
    ports:
      # 同樣只綁 loopback，外部連不到
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data               # 持久化，容器重建資料不會消失
    networks:
      - taotao-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  management:
    build:
      context: .
      dockerfile: Dockerfile
    image: taotao-management:latest
    container_name: taotao-api
    restart: unless-stopped
    depends_on:
      # 等 mysql、redis 真的健康（healthy）才啟動，
      # 不然應用程式在資料庫還沒 ready 時連線會直接失敗
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env                           # 讀取資料庫密碼、第三方金鑰等敏感設定
    environment:
      # 容器內部要用「服務名稱」當主機名（docker 內建 DNS），
      # 不能寫 localhost，因為 localhost 在容器裡指的是容器自己
      DB_HOST: mysql
      REDIS_HOST: redis
    command:
      - java
      - -jar
      - /app/app.jar
    ports:
      # 只綁 loopback，docker 本身不對外開放這個 port。
      # 真正對外公開是靠主機上執行的 `tailscale funnel --bg 8080`，
      # Tailscale 會在主機層攔截流量、處理好 HTTPS 憑證，
      # 再轉送到這裡的 127.0.0.1:8080，Java 服務本身完全不用管 TLS。
      - "127.0.0.1:8080:8080"
    networks:
      - taotao-net

networks:
  taotao-net:
    driver: bridge                     # 容器間走內部網路互相溝通，不用暴露 port 也能互連

volumes:
  mysql-data:                          # 具名 volume，容器刪除重建資料仍保留
  redis-data:
services:
  mysql:
    image: mysql:8.0
    container_name: taotao-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Taipei
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 這裡的 .sql 只在資料目錄「全新是空的」時才會執行一次
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    networks:
      - taotao-net
    healthcheck:
      # 一定要帶帳密，否則認證失敗仍可能回傳成功，healthy 會是假的
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1",
             "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      # 涵蓋首次匯入 SQL 的時間，這段失敗不計入 retries
      start_period: 60s

  redis:
    image: redis:7
    container_name: taotao-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - taotao-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  management:
    build:
      context: .
      dockerfile: Dockerfile
    image: taotao-management:latest
    container_name: taotao-api
    restart: unless-stopped
    depends_on:
      # 等 mysql、redis 真的健康才啟動，不然應用程式連線會直接失敗
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # 容器內用服務名稱當主機名，不能寫 localhost
      DB_HOST: mysql
      REDIS_HOST: redis
    command:
      - java
      - -jar
      - /app/app.jar
    ports:
      # 只綁 loopback，外部打不到，一律經 Nginx 轉發
      - "127.0.0.1:8080:8080"
    networks:
      - taotao-net

  nginx:
    image: nginx:latest
    container_name: taotao-nginx
    restart: unless-stopped
    depends_on:
      - management
    volumes:
      - ../TaoTaoFront/dist:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "80:80"
    networks:
      - taotao-net

networks:
  taotao-net:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
